<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修改密码 · 全栈网页应用管理平台</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#F3F6FA;color:#1F2937}
  .bar{max-width:840px;margin:0 auto;padding:22px 20px 0;display:flex;align-items:center}
  .bar a{font-size:14px;color:#2563EB;text-decoration:none;background:#fff;border:1px solid #C3D2E2;padding:7px 14px;border-radius:8px}
  main{max-width:480px;margin:0 auto;padding:18px 20px 44px}
  .card{background:#fff;border-radius:10px;border:1px solid #E1E9F2;padding:24px 22px}
  h1{font-size:19px;color:#0A2540;margin:0 0 6px}
  .sub{font-size:13px;color:#8A94A6;margin-bottom:10px;line-height:1.6}
  label{display:block;font-size:13px;color:#5B6573;margin:14px 0 6px}
  input{width:100%;height:42px;border:1px solid #D8E1EC;border-radius:8px;padding:0 12px;font-size:14px}
  input:focus{border-color:#2563EB;outline:none}
  .btn{height:44px;width:100%;border:none;border-radius:8px;background:#0A2540;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:20px}
  .btn:hover{background:#14365E}
  .err{color:#C0392B;font-size:13px;min-height:18px;margin-top:12px;text-align:center}
  .who{font-size:13px;color:#5B6573;background:#EDF3FA;border-radius:8px;padding:9px 12px}
</style>
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/theme.js"></script>
</head>
<body>
<div class="bar"><a href="/">← 返回门户</a></div>
<main>
  <div class="card">
    <h1>修改密码</h1>
    <div class="sub">改完后需要用新密码重新登录。</div>
    <div class="who" id="who"></div>
    <label>当前密码</label>
    <input type="password" id="oldPw" autocomplete="current-password">
    <label>新密码（至少 8 位）</label>
    <input type="password" id="newPw" autocomplete="new-password">
    <label>再输一遍新密码</label>
    <input type="password" id="newPw2" autocomplete="new-password">
    <button class="btn" id="saveBtn">保存新密码</button>
    <div class="err" id="msg"></div>
  </div>
</main>
<script src="/assets/auth.js"></script>
<script>
  if (pbRequireAuth()) {
    const u = pbUser();
    document.getElementById('who').textContent = '当前账号：' + ((u && (u.name || u.email)) || '');
  }
  document.getElementById('saveBtn').addEventListener('click', async () => {
    const msg = document.getElementById('msg');
    msg.textContent = '';
    const oldPw = document.getElementById('oldPw').value;
    const newPw = document.getElementById('newPw').value;
    const newPw2 = document.getElementById('newPw2').value;
    if (!oldPw || !newPw){ msg.textContent = '当前密码和新密码都要填'; return; }
    if (newPw.length < 8){ msg.textContent = '新密码至少 8 位'; return; }
    if (newPw !== newPw2){ msg.textContent = '两次新密码不一致'; return; }
    const u = pbUser();
    try {
      await pbApi('/api/collections/users/records/' + u.id, {
        method: 'PATCH', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: newPw, passwordConfirm: newPw, oldPassword: oldPw})
      });
      localStorage.removeItem('pb_auth');
      alert('密码已改好，请用新密码重新登录');
      location.href = '/login.html';
    } catch(e){ msg.textContent = '没改成：当前密码可能不对'; }
  });
</script>
</body>
</html>
